name: Build Web Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # เปลี่ยนมาใช้ jetli/wasm-pack-action แทนการเรียก init.sh ผ่าน curl
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM
        run: wasm-pack build crates/zsign-wasm --target web

      - name: Install Frontend Dependencies & Build Web
        run: |
          cd examples/web
          npm install
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: examples/web/dist/
